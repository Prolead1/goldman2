[project]
name = "goldman2"
version = "0.1.0"
description = "NUS FE5108 (Portfolio Theory and Investments) Fall 2026 class project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.6",
    "matplotlib>=3.9",
    "numpy>=2.1",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "scipy>=1.14",
    "statsmodels>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goldman2"]

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyterlab>=4.3",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"
